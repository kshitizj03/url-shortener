name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Typecheck and test worker
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm test
